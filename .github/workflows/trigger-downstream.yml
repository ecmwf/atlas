name: Downstream runner (atlas)
on:
  workflow_run:
    workflows:
    - CI
    types:
    - completed
  pull_request:
    types:
    - labeled
concurrency:
  group: trigger-downstream-runner-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  ci-approval:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
    - uses: ecmwf/ci-infrastructure/actions/require-ci-approval@main
  context:
    if: ${{ github.event_name != 'pull_request' || (startsWith(github.event.label.name, 'run-downstream-ci') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-slim
    permissions:
      actions: read
    outputs:
      head-sha: ${{ steps.ctx.outputs.head-sha }}
      head-branch: ${{ steps.ctx.outputs.head-branch }}
      ci-conclusion: ${{ steps.ctx.outputs.ci-conclusion }}
      ci-url: ${{ steps.ctx.outputs.ci-url }}
      ci-summary: ${{ steps.ctx.outputs.ci-summary }}
    steps:
    - name: Resolve the commit under test
      id: ctx
      uses: ecmwf/ci-infrastructure/actions/resolve-dispatch-context@main
    needs:
    - ci-approval
  label-gate:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      depth: ${{ steps.gate.outputs.depth }}
    steps:
    - name: Check the downstream-CI label
      id: gate
      uses: ecmwf/ci-infrastructure/actions/should-downstream-run@main
      with:
        sha: ${{ needs.context.outputs.head-sha }}
    needs:
    - ci-approval
    - context
  validate:
    if: ${{ (needs.context.outputs.ci-conclusion == 'success') && needs['label-gate'].outputs.run == 'true' }}
    runs-on: arc-runner-normal
    container:
      image: eccr.ecmwf.int/public-ci-images/ubuntu24.04-base:latest
    steps:
    - name: Announce image
      uses: ecmwf/ci-infrastructure/actions/announce-image@main
    - id: mint
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ secrets.CI_PERMISSIONS_APP_CLIENT_ID }}
        private-key: ${{ secrets.CI_PERMISSIONS_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.context.outputs.head-sha }}
        token: ${{ steps.mint.outputs.token }}
    - uses: ecmwf/ci-infrastructure/actions/validate-generated-workflows@main
      with:
        token: ${{ steps.mint.outputs.token }}
    needs:
    - ci-approval
    - context
    - label-gate
  report-start:
    if: ${{ (needs.context.outputs.ci-conclusion == 'success') && needs['label-gate'].outputs.run == 'true' }}
    runs-on: ubuntu-slim
    permissions:
      statuses: write
    steps:
    - name: Post pending downstream status
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api -X POST \
          "/repos/${{ github.repository }}/statuses/${{ needs.context.outputs.head-sha }}" \
          -f state=pending \
          -f context='downstream/runner' \
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          -f description='Downstream runner tests running'
    needs:
    - ci-approval
    - context
    - label-gate
  report-ci-failure:
    if: ${{ (needs.context.outputs.ci-conclusion != 'success' && needs.context.outputs.ci-conclusion != '') && needs['label-gate'].outputs.run == 'true' }}
    runs-on: ubuntu-slim
    permissions:
      statuses: write
    steps:
    - name: Post downstream failure status
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api -X POST \
          "/repos/${{ github.repository }}/statuses/${{ needs.context.outputs.head-sha }}" \
          -f state=failure \
          -f context='downstream/runner' \
          -f target_url="${{ needs.context.outputs.ci-url }}" \
          -f description="${{ needs.context.outputs.ci-summary }}; downstream runner not run"
    needs:
    - ci-approval
    - context
    - label-gate
  mir:
    name: mir
    needs:
    - ci-approval
    - context
    - label-gate
    - validate
    uses: ecmwf/mir/.github/workflows/cross-repo-trigger.yml@develop
    with:
      from-repo: ${{ github.repository }}
      from-sha: ${{ needs.context.outputs.head-sha }}
      from-jobs: '["atlas/build"]'
      branch: ${{ needs.context.outputs.head-branch }}
      fallback-ref: develop
    secrets: inherit
    if: ${{ needs['label-gate'].outputs.run == 'true' && (needs['label-gate'].outputs.depth == 'all' || needs['label-gate'].outputs.depth >= 1) }}
  report-result:
    needs:
    - ci-approval
    - context
    - label-gate
    - validate
    - mir
    if: ${{ (always() && needs.context.outputs.ci-conclusion == 'success') && needs['label-gate'].outputs.run == 'true' }}
    runs-on: ubuntu-slim
    permissions:
      statuses: write
    steps:
    - name: Post final downstream status
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        state=success
        for r in ${{ needs.validate.result }} ${{ needs.mir.result }}; do
          if [ "$r" = failure ] || [ "$r" = cancelled ]; then
            state=failure
          fi
        done
        depth="${{ needs['label-gate'].outputs.depth }}"
